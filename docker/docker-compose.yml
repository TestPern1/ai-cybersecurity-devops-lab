networks:
  # NOT internal:true. Docker's `internal: true` flag disables the iptables
  # NAT/forwarding chain for the whole bridge — including the chain
  # `docker-proxy` needs to publish a host port into a container. That means
  # `internal: true` and `ports:` are mutually incompatible on the same
  # network: Docker accepts the config silently, records the intended port
  # binding, and then never actually opens it (confirmed while debugging this
  # lab: `docker inspect`'s HostConfig.PortBindings showed the mapping, but
  # NetworkSettings.Ports stayed null — the bind never happened).
  #
  # Egress ("no internet access from these containers") is instead enforced
  # at the host firewall, one layer down, against this network's fixed
  # subnet — see docs/INSTALL.md step 10 for the firewalld rule. That
  # approach blocks outbound traffic without touching Docker's own inbound
  # port-publishing plumbing, unlike `internal: true`.
  lab_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

services:
  loki:
    image: grafana/loki:2.9.6
    container_name: lab_loki
    restart: unless-stopped
    networks:
      - lab_internal
    # Bound to all interfaces inside the VM (not 127.0.0.1) so VirtualBox's
    # NAT port-forwarding can reach it — NAT delivers forwarded traffic to
    # the VM's real NIC, not its loopback, so a 127.0.0.1-only bind here is
    # unreachable from Windows even with a correct port-forward rule (this
    # cost real debugging time to track down: TCP handshake succeeded, but
    # the VM kernel had nothing listening on the interface traffic arrived
    # on, producing a reset mid-request). Actual exposure is still scoped by
    # the VirtualBox boundary itself: only whatever's explicitly forwarded in
    # docs/INSTALL.md step 4 (to Windows' own 127.0.0.1) or reachable via the
    # private host-only network can reach this at all.
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.6
    container_name: lab_promtail
    restart: unless-stopped
    networks:
      - lab_internal
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../agents:/var/log/agents:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: lab_open_webui
    restart: unless-stopped
    networks:
      - lab_internal
    # See the comment on loki's `ports:` above — same reasoning.
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY}
      # Points at LM Studio running on the Windows HOST machine, not inside
      # this air-gapped network and not inside this VM. When this stack runs
      # inside a VirtualBox VM (see docs/INSTALL.md), host.docker.internal
      # is remapped below to the VirtualBox host-only adapter's host-side IP
      # instead of relying on host-gateway (which would only resolve to the
      # VM itself, not the Windows host one level up).
      - OPENAI_API_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=${LM_STUDIO_API_KEY:-lm-studio}
      - WEBUI_AUTH=false
    extra_hosts:
      - "host.docker.internal:${HOST_LM_STUDIO_IP:-192.168.56.1}"
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  loki_data:
  open_webui_data:
